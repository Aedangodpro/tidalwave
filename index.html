<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-09-06-e7d6cc1c-d945-4995-87d6-28aac9b7b982.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student MyPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <p class="credit">Inspired by N</p>

  <div class="sky" aria-hidden="true">
    <svg class="constellations" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" focusable="false">
      <line x1="100" y1="140" x2="160" y2="170" />
      <line x1="160" y1="170" x2="225" y2="165" />
      <line x1="225" y1="165" x2="285" y2="205" />
      <line x1="285" y1="205" x2="350" y2="190" />
      <line x1="350" y1="190" x2="405" y2="225" />
      <line x1="405" y1="225" x2="355" y2="265" />
      <line x1="355" y1="265" x2="300" y2="245" />
      <circle cx="100" cy="140" r="2.2" />
      <circle cx="160" cy="170" r="1.8" />
      <circle cx="225" cy="165" r="2" />
      <circle cx="285" cy="205" r="1.8" />
      <circle cx="350" cy="190" r="2.2" />
      <circle cx="405" cy="225" r="1.8" />
      <circle cx="355" cy="265" r="2" />
      <circle cx="300" cy="245" r="1.8" />

      <line x1="640" y1="110" x2="690" y2="160" />
      <line x1="690" y1="160" x2="730" y2="115" />
      <line x1="730" y1="115" x2="780" y2="170" />
      <line x1="780" y1="170" x2="830" y2="130" />
      <circle cx="640" cy="110" r="2" />
      <circle cx="690" cy="160" r="1.8" />
      <circle cx="730" cy="115" r="2.2" />
      <circle cx="780" cy="170" r="1.8" />
      <circle cx="830" cy="130" r="2" />

      <line x1="460" y1="400" x2="545" y2="445" />
      <line x1="545" y1="445" x2="505" y2="520" />
      <line x1="505" y1="520" x2="600" y2="555" />
      <circle cx="460" cy="400" r="2" />
      <circle cx="545" cy="445" r="2.2" />
      <circle cx="505" cy="520" r="1.8" />
      <circle cx="600" cy="555" r="2" />
    </svg>
  </div>

  <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false"
          aria-label="Switch to night mode">☾ Night mode</button>

  <div class="card">
    <h1>about:blank launcher</h1>

    <input id="urlInput" type="text" placeholder="Enter URL…" autocomplete="url"
           inputmode="url" spellcheck="false" enterkeyhint="go">
    <input id="countInput" type="number" min="1" max="20" value="1" enterkeyhint="go">

    <button id="launchBtn" type="button">Launch</button>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p class="hint">Opens the URL inside multiple about:blank tabs. Press Enter to launch — your last URL is remembered. Press N for night mode.</p>
  </div>

  <footer class="made-by">Made by Aedan and a coding agent</footer>

  <script src="script.js"></script>
</body>
</html>
